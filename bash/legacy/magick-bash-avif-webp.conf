#!/usr/bin/env bash
# magick-bat-avif-webp.conf
# Converts AVIF → WebP using ImageMagick

set -euo pipefail

if [[ $# -ne 2 ]]; then
    echo "Usage: $0 <input.avif> <output.webp>" >&2
    exit 1
fi

INPUT="$1"
OUTPUT="$2"

# Using magick (ImageMagick 7) – change to "convert" if you only have ImageMagick 6
magick "$INPUT" \
  -quality 60 \
  -define webp:method=6 \
  -define webp:lossless=false \
  "$OUTPUT"

exit $?