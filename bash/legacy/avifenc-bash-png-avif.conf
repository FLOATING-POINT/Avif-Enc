#!/usr/bin/env bash
# avifenc-png-avif.conf.sh

set -euo pipefail

if [[ $# -ne 2 ]]; then
    echo "Usage: $0 <input.png> <output.avif>" >&2
    exit 1
fi

INPUT="$1"
OUTPUT="$2"

avifenc \
  --ignore-xmp \
  --ignore-exif \
  --ignore-profile \
  --ignore-icc \
  -q 92 \
  -s 4 \
  -y 444 \
  -a end-usage=q \
  -a cq-level=36 \
  -a tune=ssim \
  -a color:sharpness=0 \
  -a color:enable-chroma-deltaq=1 \
  -a color:enable-qm=1 \
  -a color:deltaq-mode=3 \
  "$INPUT" "$OUTPUT"

exit $?