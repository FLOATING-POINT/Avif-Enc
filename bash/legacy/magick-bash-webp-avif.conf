#!/usr/bin/env bash
# magick-bat-webp-avif.conf
# Converts WebP → AVIF using ImageMagick

set -euo pipefail

if [[ $# -ne 2 ]]; then
    echo "Usage: $0 <input.webp> <output.avif>" >&2
    exit 1
fi

INPUT="$1"
OUTPUT="$2"

# Using magick (ImageMagick 7)
# -depth 10 and heic:speed are reasonable settings for AVIF
magick "$INPUT" \
  -depth 10 \
  -define heic:speed=2 \
  -quality 60 \
  "$OUTPUT"

exit $?